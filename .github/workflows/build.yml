
name: Build YALU Journal Entry Searcher EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "YALU Journal Entry Searcher" yalu_journal_entry_searcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YALU-Journal-Entry-Searcher-Windows
          path: dist/*.exe
